<form class="filter-bar" method="get"><select name="period" aria-label="{{ t('Period') }}">{% for value,label in [('today','Today'),('yesterday','Yesterday'),('week','This week'),('month','This month'),('all','All time')] %}<option value="{{ value }}" {% if request.args.get('period','today')==value %}selected{% endif %}>{{ t(label) }}</option>{% endfor %}</select><label class="field"><span>{{ t('From date') }}</span><input type="date" name="start" value="{{ request.args.get('start','') }}"></label><label class="field"><span>{{ t('To date') }}</span><input type="date" name="end" value="{{ request.args.get('end','') }}"></label>{% if request.path.endswith('/archive') %}<label class="field"><span>{{ t('Type') }}</span><select name="type"><option value="">{{ t('All types') }}</option>{% for type in ['stadium','table','quick','website'] %}<option value="{{ type }}" {% if request.args.get('type')==type %}selected{% endif %}>{{ t(type) }}</option>{% endfor %}</select></label><label class="field"><span>{{ t('Method') }}</span><select name="method"><option value="">{{ t('All methods') }}</option>{% for method in ['cash','card','debt','paid','unpaid'] %}<option value="{{ method }}" {% if request.args.get('method')==method %}selected{% endif %}>{{ t(method) }}</option>{% endfor %}</select></label><label class="field"><span>{{ t('Search') }}</span><input name="q" value="{{ request.args.get('q','') }}" placeholder="{{ t('Name, phone or reference') }}"></label>{% endif %}<button class="btn btn-outline align-end">{{ t('Apply filters') }}</button><span class="muted"><bdi>{{ start }} → {{ end }}</bdi></span></form>
