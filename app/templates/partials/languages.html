<div class="language-picker"><label class="visually-hidden" for="language">{{ t('Language') }}</label><select id="language" data-language-switch>{% for code,label in [('en','EN'),('ar','العربية')] %}<option value="/language/{{ code }}?next={{ request.full_path|urlencode }}" {% if lang==code %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><noscript><a href="/language/en">EN</a> <a href="/language/ar">العربية</a></noscript></div>
