# Verda Padel — Nginx site config
# Place at: /etc/nginx/sites-available/verda-padel.com
# Then: ln -s /etc/nginx/sites-available/verda-padel.com /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name verda-padel.com www.verda-padel.com;

    # Static files served directly by Nginx (faster, no Flask overhead)
    location /static/ {
        alias /var/www/verda-padel/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # Service worker must be served from root scope
    location = /sw.js {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Service-Worker-Allowed /;
        add_header Cache-Control "no-cache";
    }

    # All other requests go to the Flask app
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        client_max_body_size 50M;
    }
}
# SSL block is added automatically by: certbot --nginx -d verda-padel.com -d www.verda-padel.com
